<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<title>lil_guy — 390 billion of them</title>
<meta name="description" content="A wall of deterministic pixel art avatars. Every one generated from a string.">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0a0f; --panel:#12121b; --line:#22222f;
    --ink:#e9e9f2; --dim:#8a8aa2; --faint:#4e4e63; --hot:#f0a060;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font:14px/1.5 var(--mono); -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;flex-direction:column;height:100%}

  header{
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    padding:12px 18px;border-bottom:1px solid var(--line);
    background:var(--panel);z-index:3;
  }
  .brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
  .brand h1{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .brand h1 span{color:var(--hot)}
  .brand em{font-style:normal;color:var(--faint);font-size:12px}

  .ctl{display:flex;align-items:center;gap:8px}
  .ctl > label{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  select,input[type=search]{
    font:12px var(--mono);color:var(--ink);background:#191926;
    border:1px solid var(--line);border-radius:6px;padding:5px 8px;
  }
  select:focus,input:focus{outline:none;border-color:var(--hot)}
  input[type=search]{width:190px}
  input[type=range]{width:120px;accent-color:var(--hot)}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{
    font:12px var(--mono);color:var(--dim);background:#191926;
    border:0;padding:5px 10px;cursor:pointer;border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed=true]{background:var(--hot);color:#1a1208;font-weight:700}

  main{position:relative;flex:1;min-height:0}
  #scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
  #spacer{width:1px}
  #wall{position:absolute;inset:0;pointer-events:none}

  /* hover card */
  #card{
    position:absolute;z-index:5;pointer-events:none;opacity:0;
    transform:translate(-50%,-100%) translateY(-14px);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;min-width:190px;box-shadow:0 12px 30px rgba(0,0,0,.6);
    transition:opacity .1s;
  }
  #card.on{opacity:1}
  #card .nm{font-weight:700;font-size:13px;margin-bottom:6px;word-break:break-all}
  #card dl{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:11px}
  #card dt{color:var(--faint)}
  #card dd{color:var(--dim);text-align:right}

  /* pinned detail */
  #pin{
    position:absolute;right:16px;bottom:16px;z-index:6;width:250px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.7);display:none;
  }
  #pin.on{display:block}
  #pin canvas{
    width:100%;aspect-ratio:1;image-rendering:pixelated;
    background:#08080d;border-radius:8px;border:1px solid var(--line);
  }
  #pin .nm{font-weight:700;margin:10px 0 8px;word-break:break-all}
  #pin dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:11px;margin-bottom:10px}
  #pin dt{color:var(--faint)}
  #pin dd{color:var(--dim);text-align:right}
  #pin .row{display:flex;gap:6px}
  #pin button{
    flex:1;font:11px var(--mono);color:var(--ink);background:#191926;
    border:1px solid var(--line);border-radius:6px;padding:6px;cursor:pointer;
  }
  #pin button:hover{border-color:var(--hot);color:var(--hot)}

  footer{
    display:flex;gap:16px;align-items:center;
    padding:7px 18px;border-top:1px solid var(--line);
    background:var(--panel);color:var(--faint);font-size:11px;
  }
  footer a{color:var(--dim)}
  footer .sp{margin-left:auto}
  @media (max-width:820px){
    .brand em,footer .hide{display:none}
    input[type=search]{width:120px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>lil<span>_</span>guy</h1>
      <em>390 billion deterministic characters</em>
    </div>

    <div class="ctl">
      <label for="order">order</label>
      <select id="order">
        <option value="hue">colour gradient</option>
        <option value="random">random</option>
        <option value="head">by head shape</option>
        <option value="palette">by palette</option>
      </select>
    </div>

    <div class="ctl">
      <label for="size">size</label>
      <input type="range" id="size" min="8" max="72" step="4" value="20">
    </div>

    <div class="ctl">
      <label>count</label>
      <div class="seg" id="count">
        <button data-n="2500" aria-pressed="true">2.5k</button>
        <button data-n="10000">10k</button>
        <button data-n="50000">50k</button>
        <button data-n="200000">200k</button>
      </div>
    </div>

    <div class="ctl">
      <input type="search" id="find" placeholder="your name, email…" spellcheck="false">
    </div>
  </header>

  <main>
    <div id="scroll"><div id="spacer"></div></div>
    <canvas id="wall"></canvas>
    <div id="card" role="status" aria-live="off"></div>
    <div id="pin"></div>
  </main>

  <footer>
    <span id="stat">…</span>
    <span class="sp"></span>
    <span class="hide">hover to inspect · click to pin</span>
    <a href="https://github.com/isaacaudet/lil_guy">github</a>
    <a href="https://www.npmjs.com/package/lil_guy">npm</a>
  </footer>
</div>

<script src="./lil-guy.js"></script>
<script src="./app.js"></script>
</body>
</html>
