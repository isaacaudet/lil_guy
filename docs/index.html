<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<title>lil_guy</title>
<meta name="description" content="Type anything, get a lil guy. Deterministic pixel characters.">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#08080a}
  body{
    font:400 11px/1.7 ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    color:#fff;-webkit-font-smoothing:antialiased;
    overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent;
  }
  ::selection{background:rgba(255,255,255,.16)}

  .view{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .34s ease}
  .view.on{opacity:1;pointer-events:auto}

  /* ---------------------------------------------------------------- maker */
  #drift{position:absolute;inset:0;width:100%;height:100%;opacity:.26;z-index:0;cursor:pointer}
  /* Sink the middle of the field so the guy you are making, and the words
     under him, sit on near-black instead of on somebody else's face. */
  #maker::before{
    content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(42% 55% at 50% 55%,rgba(8,8,10,.97) 26%,rgba(8,8,10,.6) 70%,rgba(8,8,10,0) 100%);
  }
  #maker > *:not(#drift):not(.hud){position:relative;z-index:2}
  #count{margin-top:20px;color:rgba(255,255,255,.34);letter-spacing:.08em}

  #claimForm{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:20px}
  #claimForm[hidden]{display:none}
  #claimName{
    width:min(70vw,320px);background:none;border:0;
    border-bottom:1px solid rgba(255,255,255,.13);color:#fff;
    font-family:inherit;font-size:13px;text-align:center;padding:0 4px 8px;
  }
  #claimName::placeholder{color:rgba(255,255,255,.22)}
  #claimName:focus{outline:none;border-bottom-color:rgba(255,255,255,.4)}
  #claimForm button{
    background:none;border:0;cursor:pointer;font:inherit;letter-spacing:.06em;
    color:rgba(255,255,255,.5);transition:color .18s ease;
  }
  #claimForm button:hover{color:rgba(255,255,255,.9)}
  .fine{color:rgba(255,255,255,.2);max-width:min(84vw,380px);text-align:center;line-height:1.6}

  /* ----------------------------------------------------------------- wall */
  #wallScroll{position:absolute;inset:0;overflow-y:auto;padding:8vh 6vw 22vh}
  #wallGrid{
    display:grid;gap:26px 20px;
    grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
    max-width:1100px;margin:0 auto;
  }
  .pin{text-align:center}
  .pin canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;display:block}
  .pin span{display:block;margin-top:8px;color:rgba(255,255,255,.4);word-break:break-word}
  #wallEmpty{color:rgba(255,255,255,.3);text-align:center;padding:14vh 0}
  #maker{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
  #stage{
    width:min(40vh,320px);height:min(40vh,320px);
    image-rendering:pixelated;display:block;
  }
  #name{
    width:min(78vw,420px);margin-top:6px;
    background:none;border:0;border-bottom:1px solid rgba(255,255,255,.13);
    color:#fff;font-family:inherit;font-size:15px;line-height:1.6;
    text-align:center;letter-spacing:.01em;
    padding:0 4px 10px;
  }
  #name::placeholder{color:rgba(255,255,255,.22)}
  #name:focus{outline:none;border-bottom-color:rgba(255,255,255,.4)}

  .acts{display:flex;gap:26px;margin-top:22px}
  .acts button{
    background:none;border:0;padding:4px 0;cursor:pointer;
    color:rgba(255,255,255,.34);font:inherit;letter-spacing:.06em;
    transition:color .18s ease;
  }
  .acts button:hover,.acts button:focus-visible{color:rgba(255,255,255,.88);outline:none}

  /* --------------------------------------------------------------- plane */
  #plane{position:absolute;inset:0;display:block;cursor:grab;touch-action:none}
  #plane.drag{cursor:grabbing}
  #veil{
    position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(to top right,rgba(7,7,9,.94) 0%,rgba(7,7,9,.7) 12%,rgba(7,7,9,0) 34%),
      radial-gradient(125% 95% at 50% 45%,transparent 38%,rgba(6,6,8,.6) 100%);
  }

  /* ----------------------------------------------------------- picked guy */
  #pick{
    position:absolute;right:max(22px,env(safe-area-inset-right));
    bottom:max(20px,env(safe-area-inset-bottom));z-index:4;
    display:flex;align-items:center;gap:14px;
    padding:14px 16px;border-radius:14px;
    background:rgba(14,14,18,.86);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.07);
    box-shadow:0 18px 48px rgba(0,0,0,.6);
  }
  #pick[hidden]{display:none}
  #pickArt{width:56px;height:56px;image-rendering:pixelated;display:block}
  #pickForm{display:flex;align-items:center;gap:12px}
  #pickName{
    width:150px;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.14);
    color:#fff;font-family:inherit;font-size:12px;padding:0 2px 6px;
  }
  #pickName::placeholder{color:rgba(255,255,255,.24)}
  #pickName:focus{outline:none;border-bottom-color:rgba(255,255,255,.45)}
  #pick button{
    background:none;border:0;cursor:pointer;font:inherit;color:rgba(255,255,255,.5);
    letter-spacing:.05em;transition:color .18s ease;padding:0;
  }
  #pick button:hover{color:rgba(255,255,255,.92)}
  #pickClose{font-size:16px;line-height:1;color:rgba(255,255,255,.25)}

  /* ----------------------------------------------------------------- hud */
  .hud{
    position:fixed;left:max(22px,env(safe-area-inset-left));
    bottom:max(20px,env(safe-area-inset-bottom));
    user-select:none;letter-spacing:.02em;z-index:3;
  }
  .hud b{display:block;font-weight:600;font-size:13px;letter-spacing:-.01em;color:rgba(255,255,255,.92);margin-bottom:2px}
  .hud b i{font-style:normal;color:rgba(255,255,255,.28)}
  .hud p{color:rgba(255,255,255,.3)}
  .hud a{color:rgba(255,255,255,.34);text-decoration:none;transition:color .18s ease}
  .hud a:hover{color:rgba(255,255,255,.85)}
  #seed{color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
  #hint{transition:opacity .5s ease}
  #galleryView.touched #hint{opacity:0}
</style>
</head>
<body>

<section id="maker" class="view">
  <canvas id="drift"></canvas>
  <canvas id="stage" width="512" height="512"></canvas>
  <input id="name" type="text" placeholder="type your name" spellcheck="false"
         autocomplete="off" autocapitalize="off" autocorrect="off">
  <div class="acts">
    <button id="claim">claim</button>
    <button id="savePlain">save png</button>
    <button id="saveNamed">save png with name</button>
  </div>
  <form id="claimForm" hidden>
    <input id="claimName" type="text" placeholder="your name, for the wall" spellcheck="false"
           autocomplete="off" maxlength="40">
    <button type="submit">pin him up</button>
    <p class="fine">your word stays in this browser and is never shown &mdash; only the guy it makes</p>
  </form>
  <p id="count">one of 390,134,169,600</p>
  <div class="hud">
    <b>lil<i>_</i>guy</b>
    <p><a href="#wall">your wall →</a>&nbsp;&nbsp;<a href="#gallery">gallery →</a></p>
    <p><a href="https://github.com/isaacaudet/lil_guy">github.com/isaacaudet/lil_guy</a></p>
  </div>
</section>

<section id="wallView" class="view">
  <div id="wallScroll"><div id="wallGrid"></div></div>
  <div class="hud">
    <b>lil<i>_</i>guy</b>
    <p id="wallCount">&nbsp;</p>
    <p><a href="#">← make another</a></p>
  </div>
</section>

<section id="galleryView" class="view">
  <canvas id="plane"></canvas>
  <div id="veil"></div>
  <div id="pick" hidden>
    <canvas id="pickArt" width="128" height="128"></canvas>
    <form id="pickForm">
      <input id="pickName" type="text" placeholder="your name" spellcheck="false"
             autocomplete="off" maxlength="40">
      <button type="submit">claim him</button>
    </form>
    <button id="pickClose" type="button" aria-label="dismiss">&times;</button>
  </div>
  <div class="hud">
    <b>lil<i>_</i>guy</b>
    <p id="seed">&nbsp;</p>
    <p id="hint">drag to wander · pinch or scroll to zoom</p>
    <p><a href="#" id="mode">order by colour →</a></p>
    <p><a href="#">← make your own</a></p>
  </div>
</section>

<script src="./lil-guy.js"></script>
<script src="./app.js"></script>
</body>
</html>
