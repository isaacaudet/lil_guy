<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<title>lil_guy</title>
<meta name="description" content="An endless plane of deterministic pixel characters.">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0b0b0d}
  body{
    font:400 11px/1.7 ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    color:#fff; -webkit-font-smoothing:antialiased;
    overscroll-behavior:none; touch-action:none;
    -webkit-tap-highlight-color:transparent;
  }
  canvas{
    position:fixed;inset:0;display:block;
    cursor:grab; touch-action:none;
  }
  canvas.drag{cursor:grabbing}

  /* the only chrome */
  #hud{
    position:fixed;left:max(22px,env(safe-area-inset-left));
    bottom:max(20px,env(safe-area-inset-bottom));
    pointer-events:none; user-select:none;
    letter-spacing:.02em;
  }
  #hud b{
    display:block;font-weight:600;font-size:13px;letter-spacing:-.01em;
    color:rgba(255,255,255,.92);margin-bottom:2px;
  }
  #hud b i{font-style:normal;color:rgba(255,255,255,.3)}
  #hud p{color:rgba(255,255,255,.3)}
  #hint{transition:opacity .5s ease}
  #hud.touched #hint{opacity:0}
  #hud #seed{color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
  #hud a{color:rgba(255,255,255,.3);text-decoration:none;pointer-events:auto}
  #hud a:hover{color:rgba(255,255,255,.7)}

  /* light falloff at the edges, so the plane reads as endless */
  #veil{
    position:fixed;inset:0;pointer-events:none;
    background:
      linear-gradient(to top right,rgba(7,7,9,.94) 0%,rgba(7,7,9,.72) 12%,rgba(7,7,9,0) 34%),
      radial-gradient(125% 95% at 50% 45%,transparent 38%,rgba(6,6,8,.6) 100%);
  }
</style>
</head>
<body>
<canvas id="plane"></canvas>
<div id="veil"></div>
<div id="hud">
  <b>lil<i>_</i>guy</b>
  <p id="seed">&nbsp;</p>
  <p id="hint">drag to wander · pinch or scroll to zoom</p>
  <p><a href="https://github.com/isaacaudet/lil_guy">github.com/isaacaudet/lil_guy</a></p>
</div>
<script src="./lil-guy.js"></script>
<script src="./app.js"></script>
</body>
</html>
